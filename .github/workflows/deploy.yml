name: Todo CI/CD WF

on:
  push:
    branches:
      - github-actions

  pull_request:
    branches:
      - github-actions

permissions:
  contents: read

jobs:
  build-test-scan:
    name: Build, Test, Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test, Checkstyle and SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify \
            checkstyle:checkstyle \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: todolist-app-1.0.0
          path: target/*.jar

  deploy:
    name: Push image and deploy
    needs: build-test-scan
    if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: todolist-app-1.0.0
          path: target


      - name: Debug OIDC claims
        shell: bash
        run: |
          curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | python3 -c '
          import sys, json, base64
          token = json.load(sys.stdin)["value"]
          part = token.split(".")[1]
          claims = json.loads(
              base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))
          )
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          '  

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name:
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name:
          Deploy to ECS
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          ECS_CLUSTER: ${{ vars.CLUSTER }}
          ECS_SERVICE: ${{ vars.SERVICE }}
        run: bash scripts/deploy-ecs.sh
